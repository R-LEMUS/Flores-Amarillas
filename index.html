<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti 💛</title>

  <!-- Google Fonts: Cursive Dancing Script for lyrics & Montserrat for controls -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #050507;
      color: #f2f2f2;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Canvas styling */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #bg-canvas {
      z-index: 1;
    }

    #flower-canvas {
      z-index: 2;
    }

    /* Start Screen Overlay */
    .start-screen {
      position: absolute;
      z-index: 30;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050507;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      text-align: center;
      padding: 30px;
      max-width: 400px;
    }

    .start-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #ffd866;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      margin-bottom: 25px;
    }

    .start-btn {
      display: inline-block;
      border: 1px solid rgba(255, 223, 128, 0.4);
      padding: 14px 32px;
      border-radius: 30px;
      color: #fce897;
      font-size: 0.85rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: rgba(255, 223, 128, 0.05);
      backdrop-filter: blur(5px);
      transition: all 0.4s ease;
    }

    .start-btn:hover {
      background: rgba(255, 223, 128, 0.18);
      border-color: rgba(255, 223, 128, 0.8);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
    }

    /* Lyrics Display Container */
    .lyrics-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      width: min(90%, 760px);
      pointer-events: none;
    }

    .lyric-line {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.35;
      color: #fff4bd;
      opacity: 0;
      transform: translateY(15px) scale(0.98);
      transition: opacity 0.8s ease, transform 0.8s ease;
      text-shadow:
        0 0 12px rgba(255, 215, 0, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.8);
      font-weight: 700;
      padding: 0 16px;
    }

    .lyric-line.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }


    @media (max-width: 600px) {
      .lyrics-container {
        width: 94%;
      }

      .lyric-line {
        font-size: 2rem;
      }

      .start-title {
        font-size: 2.6rem;
      }
    }
  </style>
</head>

<body>

  <!-- Canción local incluida con la página -->
  <audio id="bg-music" preload="auto" src="Chris Rainbow - Be Like a Woman.mp3"></audio>

  <!-- Initial Start Screen Overlay -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <div class="start-title">Para Ti 💛</div>
      <div class="start-btn">Espero que te guste ✨</div>
    </div>
  </div>

  <!-- Canvases -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="flower-canvas"></canvas>

  <!-- Lyrics Container -->
  <div class="lyrics-container">
    <p class="lyric-line" id="lyricBox"></p>
  </div>


  <script>
    // --- DURACIÓN DE LA EXPERIENCIA ---
    // 2:06 = 126 segundos.
    let START_TIME = 0;
    let END_TIME = 126;
    const FADE_START_TIME = 124.5;

    // --- LÍRICA Y TIEMPOS ---
    let lyricsData = [
      { time: 25, text: "Show me the light" },
      { time: 28, text: "Tell me a story" },
      { time: 31, text: "And make it a good one" },
      { time: 38, text: "Out of the night" },
      { time: 40, text: "Into a new day"},
      { time: 44, text: "Under the hot sun"},
      { time: 49, text: "Stay out at night"},
      { time: 51, text: "See who you wanna see, yeah"}, 
      { time: 61, text: "Do what you want"},
      { time: 64, text: "But Be Like a Woman to me"},
      { time: 71, text: "Oh, oh"},
      { time: 73, text: "Give all you've got"},
      { time: 76, text: "Under the moonlight"},
      { time: 79, text: "It's yours for the taking"},
      { time: 85, text: "Don't turn around"},
      { time: 88, text: "If you hear a sound"},
      { time: 91, text: "It's just my heart breaking"},
      { time: 97, text: "Do what you want"},
      { time: 100, text: "But save the last dance for me, yeah"},
      { time: 109, text: "Love is alright"},
      { time: 112, text: "But Be Like a Woman to me"},
      { time: 121, text: "Oh (Be Like a Woman to me)"}
    ];

    // Elementos DOM
    const audio = document.getElementById('bg-music');
    const startScreen = document.getElementById('startScreen');
    const lyricBox = document.getElementById('lyricBox');

    // Canvas Contexts
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    const flowerCanvas = document.getElementById('flower-canvas');
    const flowerCtx = flowerCanvas.getContext('2d');

    // Variables de Estado
    let width, height, centerX, centerY, heartScale;
    let particles = [];
    let spontaneousFlowers = [];
    let heartFlowers = [];
    let heartSpiralPoints = [];
    let heartAnimationComplete = false;
    let spiralIndex = 0;
    let isSpiralActive = false;
    let isEndingTriggered = false;
    let experienceFinished = false;
    let lastSpontaneousTime = 0;

    function resize() {
      width = bgCanvas.width = flowerCanvas.width = window.innerWidth;
      height = bgCanvas.height = flowerCanvas.height = window.innerHeight;

      centerX = width / 2;
      centerY = height / 2 + 20;

      heartScale = Math.min(width, height) / 42;
    }

    // Partículas de luz dorada sutil flotando en el fondo
    class AmbientParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.6;
        this.opacity = Math.random() * 0.4 + 0.1;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;

        if (this.y < -10) {
          this.y = height + 10;
        }

        if (this.x < 0 || this.x > width) {
          this.reset();
        }
      }

      draw() {
        bgCtx.save();

        bgCtx.globalAlpha = this.opacity;
        bgCtx.fillStyle = '#fce897';
        bgCtx.shadowBlur = 6;
        bgCtx.shadowColor = 'rgba(255, 215, 0, 0.3)';

        bgCtx.beginPath();
        bgCtx.arc(
          this.x,
          this.y,
          this.size,
          0,
          Math.PI * 2
        );
        bgCtx.fill();

        bgCtx.restore();
      }
    }

    class YellowFlower {
      constructor(x, y, targetSize, isHeart = false) {
        this.x = x;
        this.y = y;
        this.targetSize = targetSize;
        this.currentSize = 0;
        this.growthRate = 0.06;
        this.rotation = Math.random() * Math.PI * 2;
        this.petals = 6;
        this.isHeart = isHeart;
      }

      update() {
        if (this.currentSize < this.targetSize) {
          this.currentSize +=
            (this.targetSize - this.currentSize) *
            this.growthRate + 0.1;

          if (this.currentSize > this.targetSize) {
            this.currentSize = this.targetSize;
          }
        }
      }

      draw() {
        if (this.currentSize <= 0) return;

        flowerCtx.save();

        flowerCtx.translate(this.x, this.y);
        flowerCtx.rotate(this.rotation);

        // Renderizado de pétalos con gradiente cálido
        for (let i = 0; i < this.petals; i++) {
          const angle =
            (i * Math.PI * 2) / this.petals;

          flowerCtx.save();
          flowerCtx.rotate(angle);

          const grad = flowerCtx.createLinearGradient(
            0,
            0,
            this.currentSize,
            0
          );

          grad.addColorStop(0, '#fff6b3');
          grad.addColorStop(0.5, '#fdd835');
          grad.addColorStop(1, '#c79100');

          flowerCtx.fillStyle = grad;

          flowerCtx.beginPath();

          flowerCtx.ellipse(
            this.currentSize * 0.75,
            0,
            this.currentSize * 0.65,
            this.currentSize * 0.3,
            0,
            0,
            Math.PI * 2
          );

          flowerCtx.fill();
          flowerCtx.restore();
        }

        // Centro cálido de la flor
        flowerCtx.beginPath();
        flowerCtx.arc(
          0,
          0,
          this.currentSize * 0.32,
          0,
          Math.PI * 2
        );
        flowerCtx.fillStyle = '#8c4a00';
        flowerCtx.fill();

        flowerCtx.beginPath();
        flowerCtx.arc(
          0,
          0,
          this.currentSize * 0.18,
          0,
          Math.PI * 2
        );
        flowerCtx.fillStyle = '#5e2e00';
        flowerCtx.fill();

        flowerCtx.restore();
      }
    }

    // Genera una espiral densa que va desde el centro hacia
    // el borde del corazón, rellenando progresivamente su interior.
    function generateHeartSpiralPoints(totalPoints = 1100) {
      const points = [];
      const loops = 12;

      for (let i = 0; i < totalPoints; i++) {
        const progress = i / (totalPoints - 1);

        // Varias vueltas mientras el corazón crece desde el centro.
        const angle =
          progress * Math.PI * 2 * loops;

        const heartT = angle % (Math.PI * 2);

        const hX =
          16 * Math.pow(Math.sin(heartT), 3);

        const hY =
          -(
            13 * Math.cos(heartT) -
            5 * Math.cos(2 * heartT) -
            2 * Math.cos(3 * heartT) -
            Math.cos(4 * heartT)
          );

        // Del centro hacia el contorno.
        const spiralScale =
          0.025 + 0.975 * progress;

        // Una pequeña variación evita que las flores formen
        // líneas mecánicas y ayuda a cerrar huecos.
        const jitter =
          0.92 + Math.random() * 0.08;

        points.push({
          x: hX * spiralScale * jitter,
          y: hY * spiralScale * jitter,
          size: 8.5 + Math.random() * 5.5
        });
      }

      return points;
    }

    function init() {
      resize();

      particles = Array.from(
        { length: 60 },
        () => new AmbientParticle()
      );

      heartSpiralPoints =
        generateHeartSpiralPoints(1100);
    }

    // Spawnea una flor espontánea lejos del centro
    // para no opacar la lírica
    function spawnSpontaneousFlower() {
      let x, y;
      let safe = false;
      let attempts = 0;

      while (!safe && attempts < 15) {
        x =
          Math.random() *
          (width - 80) +
          40;

        y =
          Math.random() *
          (height - 80) +
          40;

        // Mantener una zona central limpia para que la lírica
        // permanezca completamente despejada.
        const referenceSize = Math.min(width, height);
        const normalizedX =
          (x - centerX) / (referenceSize * 0.34);
        const normalizedY =
          (y - centerY) / (referenceSize * 0.20);

        if (
          normalizedX * normalizedX +
          normalizedY * normalizedY > 1
        ) {
          safe = true;
        }

        attempts++;
      }

      const size =
        Math.random() * 6 + 14;

      spontaneousFlowers.push(
        new YellowFlower(
          x,
          y,
          size
        )
      );
    }

    function animate(timestamp) {
      bgCtx.clearRect(
        0,
        0,
        width,
        height
      );

      flowerCtx.clearRect(
        0,
        0,
        width,
        height
      );

      // 1. Partículas de Fondo
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // 2. Flores espontáneas durante la canción.
      // Nunca invaden la zona central reservada para la lírica.
      if (
        !audio.paused &&
        !experienceFinished &&
        audio.currentTime < FADE_START_TIME
      ) {
        if (
          !lastSpontaneousTime ||
          timestamp - lastSpontaneousTime > 1400
        ) {
          spawnSpontaneousFlower();
          lastSpontaneousTime = timestamp;
        }
      }

      // 3. Dibujar flores espontáneas
      spontaneousFlowers.forEach(f => {
        f.update();
        f.draw();
      });

      // 4. Animación del corazón en espiral.
      // Comienza cuando termina la canción y coloca varias
      // flores por frame para que el corazón quede relleno
      // en pocos segundos.
      if (
        isSpiralActive &&
        spiralIndex < heartSpiralPoints.length
      ) {
        const flowersPerFrame = 7;

        for (
          let i = 0;
          i < flowersPerFrame &&
          spiralIndex < heartSpiralPoints.length;
          i++
        ) {
          const pt =
            heartSpiralPoints[spiralIndex];

          const posX =
            centerX +
            pt.x * heartScale;

          const posY =
            centerY +
            pt.y * heartScale;

          heartFlowers.push(
            new YellowFlower(
              posX,
              posY,
              pt.size,
              true
            )
          );

          spiralIndex++;
        }

        if (
          spiralIndex >=
          heartSpiralPoints.length
        ) {
          heartAnimationComplete = true;
        }
      }

      // Dibujar flores del corazón
      heartFlowers.forEach(f => {
        f.update();
        f.draw();
      });

      // 5. Control del Audio y Lírica
      if (!audio.paused) {
        const currTime =
          audio.currentTime;

        // Mostrar verso según el tiempo
        const currentLyric =
          lyricsData
            .slice()
            .reverse()
            .find(
              l => currTime >= l.time
            );

        if (
          currentLyric &&
          lyricBox.innerText !==
            currentLyric.text
        ) {
          lyricBox.classList.remove(
            'active'
          );

          setTimeout(() => {
            lyricBox.innerText =
              currentLyric.text;

            lyricBox.classList.add(
              'active'
            );
          }, 250);
        }

        // Desvanecer la lírica al acercarse el final.
        if (currTime >= FADE_START_TIME) {
          const fadeProgress =
            (currTime - FADE_START_TIME) /
            (END_TIME - FADE_START_TIME);

          const remaining =
            Math.max(0, 1 - fadeProgress);

          lyricBox.style.opacity = remaining;
          audio.volume = remaining;
        }

        // Detener exactamente en 2:06.
        if (
          currTime >= END_TIME &&
          !isEndingTriggered
        ) {
          finishExperience();
        }
      }

      requestAnimationFrame(
        animate
      );
    }

    function finishExperience() {
      if (isEndingTriggered) return;

      isEndingTriggered = true;
      experienceFinished = true;

      // Detener la canción exactamente en 2:06.
      audio.pause();
      audio.currentTime = END_TIME;
      audio.volume = 0;

      // Eliminar cualquier flor espontánea para dejar
      // únicamente el corazón final.
      spontaneousFlowers = [];

      // Ocultar completamente la lírica.
      lyricBox.classList.remove('active');
      lyricBox.innerText = '';
      lyricBox.style.opacity = '0';

      // Comenzar inmediatamente el corazón en espiral.
      isSpiralActive = true;
    }

    // Si el archivo de audio termina por sí solo,
    // también ejecutamos el cierre de la experiencia.
    audio.addEventListener('ended', finishExperience);

    // Un clic en la pantalla inicial
    // inicia la animación y la canción
    startScreen.addEventListener(
      'click',
      async () => {
          startScreen.classList.add(
          'hidden'
        );

        // Reiniciar el estado por si la experiencia se vuelve a ejecutar.
        isEndingTriggered = false;
        experienceFinished = false;
        isSpiralActive = false;
        heartAnimationComplete = false;
        spiralIndex = 0;
        heartFlowers = [];
        spontaneousFlowers = [];
        lyricBox.style.opacity = '';
        lyricBox.classList.remove('active');
        lyricBox.innerText = '';

        audio.currentTime =
          START_TIME;

        audio.volume = 1;

        try {
          await audio.play();
        } catch (err) {
          console.log(
            "No se pudo iniciar el audio:",
            err
          );
        }
      }
    );

    window.addEventListener(
      'resize',
      resize
    );

    // Inicialización al cargar
    // la ventana
    window.onload = () => {
      init();
      requestAnimationFrame(
        animate
      );
    };
  </script>

</body>
</html>
